# Catches what breaks the mod before anyone launches the game: Lua syntax errors (including Lua's 200-locals limit,
# which main.lua and rivals.lua sit close to) and Python files that don't compile. Needs no game files.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Lua syntax (scripts/luacheck.py, Lua 5.4 like UE4SS)
        run: python scripts/luacheck.py $(git ls-files '*.lua')
      - name: Python compiles
        run: python -m py_compile $(git ls-files '*.py' '*.pyw')
      - name: Python lint (ruff.toml)
        run: pip install ruff && python -m ruff check .
      - name: Linux mode switch (scripts/pvemode.py, issue #127)
        run: python scripts/test_pvemode.py
      - name: Offline backend (the stand-in's login, stash, schema and coverage; issue #80)
        run: python tools/test_standin_flow.py && python tools/test_standin_gaps.py
